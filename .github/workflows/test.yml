name: Unit & Smoke tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun --no-env-file install

      - name: Run Bun tests
        run: bun --no-env-file test --isolate ./src

  nodejs-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [16.x, 18.x, 20.x, 22.x, 24.x, 26.x, latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun --no-env-file install

      - name: Build
        run: bun --no-env-file run build

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Run .mjs file
        run: |
          echo "Running ESM import test on ${{ matrix.node-version }}"
          node smoke-tests/import.mjs

      - name: Run .cjs file
        run: |
          echo "Running CJS require test on ${{ matrix.node-version }}"
          node smoke-tests/require.cjs

  bun-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.1.0", "1.1.44", "1.2.23", "1.3.3", "1.4.2", latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun for building
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun --no-env-file install

      - name: Build
        run: bun --no-env-file run build

      - name: Set up Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Run .mjs file
        run: |
          echo "Running ESM import test on ${{ matrix.bun-version }}"
          bun run smoke-tests/import.mjs

      - name: Run .cjs file
        run: |
          echo "Running CJS require test on ${{ matrix.bun-version }}"
          bun run smoke-tests/require.cjs

  deno-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        deno-version: ["2.0.0", "2.1.0", "2.2.0", "2.4.0", "2.5.6", latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun --no-env-file install

      - name: Build
        run: bun --no-env-file run build

      - name: Setup Deno ${{ matrix.deno-version }}
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Run .mjs file
        run: |
          echo "Running ESM import test on ${{ matrix.deno-version }}"
          deno run smoke-tests/import.mjs

      - name: Run .cjs file
        run: |
          echo "Running CJS require test on ${{ matrix.deno-version }}"
          deno run --allow-read smoke-tests/require.cjs
